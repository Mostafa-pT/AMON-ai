}.panel-body{padding:15px;overflow:auto}.card{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:13px;margin-bottom:9px}.card h3{margin:0 0 7px;font-size:13px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#1b232c;border:1px solid var(--border);padding:9px 13px;border-radius:10px;font-size:11px;z-index:300}.hidden{display:none!important}@media(max-width:760px){.sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(105%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid}.chat{padding:19px 9px 175px}.composer{padding-left:7px;padding-right:7px}.quick{grid-template-columns:1fr}.user-bubble{max-width:94%}}@media(max-width:430px){.head-title{display:none}.welcome{padding-top:5vh}.welcome p{font-size:13px}.note{display:none}}

.amon-services{padding:8px 10px;border-bottom:1px solid var(--line)}

body{background:#fff;color:var(--text)}

.owner-chat-panel{width:min(1120px,97vw)!important;background:#f7f9fc!important;color:#172033!important;border-left:1px solid #dbe3ee!important;box-shadow:-28px 0 80px rgba(15,23,42,.22)!important}

/* ===== PERSISTENT CHAT HISTORY + RESPONSE FEEDBACK ===== */
.history-item{position:relative;width:100%;display:flex!important;align-items:center;gap:7px;text-align:right}
.history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

.history-action:hover{background:rgba(127,127,127,.12);opacity:1}

.history-item.archived{opacity:.62}
.history-section-label{font-size:11px;color:var(--muted);padding:10px 8px 5px;font-weight:800}

/* AMON Appearance & Answer Studio */
:root[data-theme="dark"]{--bg:#0b0d10;--panel:#11161c;--panel2:#161c23;--line:#26313c;--text:#f4f7fb;--muted:#9aa6b2;--blue:#5b8cff;--blue2:#12233f}
:root[data-theme="dark"] .header,:root[data-theme="dark"] .sidebar,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .panel-head{background:#0f141a!important}:root[data-theme="dark"] .message .amon-bubble,:root[data-theme="dark"] .card{background:#121820!important}:root[data-theme="dark"] .tools-menu{background:#121820;color:#eef2f7}:root[data-theme="dark"] .user-bubble{background:#162846!important}:root[data-theme="dark"] .input-box{background:#121820}
:root[data-theme="dark"]{--bg:#0b0d10;--panel:#11161c;--panel2:#161c23;--line:#26313c;--text:#f4f7fb;--muted:#aab5c1;--blue:#6d95ff;--blue2:#14233d;--border:#26313c;--sidebar-bg:#0f141a;--header-bg:#11161c;--user-bg:#162846;--user-line:#294a75}
:root[data-theme="dark"] .header,:root[data-theme="dark"] .sidebar,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .panel-head{background:var(--panel)!important;color:var(--text)!important}
:root[data-theme="dark"] .message .amon-bubble,:root[data-theme="dark"] .card,:root[data-theme="dark"] .input-box,:root[data-theme="dark"] textarea,:root[data-theme="dark"] button{color:var(--text)}
.appearance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.appearance-choice{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;text-align:right;color:var(--text)}.appearance-choice.active{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 15%,transparent)}.appearance-choice small{display:block;color:var(--muted);margin-top:4px}
.style-row{display:flex;flex-wrap:wrap;gap:7px}.style-chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 11px;font-size:11px}.style-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.amon-inline-link{position:relative;z-index:5;pointer-events:auto;cursor:pointer}.amon-bubble a{pointer-events:auto!important;cursor:pointer!important}

/* Final compact premium link cards */
.amon-safe-links{display:flex!important;align-items:center!important;gap:5px!important;margin:7px 0 0!important;padding:0!important;border:0!important;background:transparent!important}
.amon-safe-links a{height:28px!important;min-height:28px!important;padding:0 9px!important;border-radius:999px!important;font-size:10px!important;font-weight:800!important;letter-spacing:.1px!important;border:1px solid rgba(37,99,235,.18)!important;background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(15,23,42,.02))!important;color:#2563eb!important;box-shadow:0 2px 8px rgba(15,23,42,.05)!important}
.amon-safe-links a::before{content:"↗"!important;font-size:11px!important}.amon-safe-links a:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(37,99,235,.12)!important}
:root[data-theme="dark"] .amon-safe-links a,:root[data-theme="midnight"] .amon-safe-links a{background:rgba(91,140,255,.12)!important;color:#8db3ff!important;border-color:rgba(141,179,255,.2)!important}
@media(max-width:760px){.head-right{gap:5px!important}.tools-menu#appearanceButton{display:inline-flex!important;padding:7px 9px!important}.tools-menu#appearanceButton span{display:none}}
/* Premium AMON command center */
.amon-services{padding:8px 10px 12px}
.service{position:relative;min-height:42px;margin:2px 0;border:1px solid transparent;border-radius:12px;padding:10px 11px;transition:.18s ease;background:transparent}
.service i{width:24px;height:24px;display:grid;place-items:center;font-style:normal;font-size:15px;border-radius:8px;background:rgba(37,99,235,.07);color:var(--blue)}
.service span{font-weight:650;letter-spacing:.05px}
.service:hover{background:rgba(37,99,235,.055);border-color:rgba(37,99,235,.08);transform:translateX(-2px)}
.service.active{background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(37,99,235,.045));border-color:rgba(37,99,235,.12);box-shadow:0 5px 18px rgba(37,99,235,.06)}
.service.active i{background:var(--blue);color:#fff;box-shadow:0 5px 13px rgba(37,99,235,.22)}
.side-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding-top:13px}
/* AMON response layout hardening */
.message.amon{max-width:min(920px,100%);margin-inline:auto;width:100%}
.message.amon .amon-body{max-width:min(760px,88%);flex:none}
.amon-bubble{display:block;width:fit-content;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:15px 17px;line-height:1.9;box-shadow:0 7px 24px rgba(15,23,42,.045);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);text-align:right}
:root[data-theme="dark"] .amon-bubble{background:#121820;border-color:#26313c;color:#f4f7fb}
.message.user .user-bubble{max-width:min(760px,88%)}
@media(max-width:760px){.message.amon .amon-body,.message.user .user-bubble{max-width:calc(100vw - 76px)}.amon-bubble{padding:13px 14px}}
.tool-workspace{display:grid;gap:12px}.tool-workspace textarea{min-height:260px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:14px;line-height:1.8}.tool-actions{display:flex;flex-wrap:wrap;gap:8px}.tool-actions button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:11px}.tool-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
</style>

<style>
/* AMON V4 — organized single workspace */
.sidebar{position:fixed;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:180;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 35px rgba(15,23,42,.10);transform:translateX(105%);transition:transform .2s ease;overflow:auto}.sidebar.open{transform:translateX(0)}
.main{width:100%;flex:1}.header{height:64px;background:#fff}.tools-menu{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700}.tools-menu:hover{background:#f7f8fa;border-color:#cbd5e1}.head-right{gap:8px}.chat{padding-bottom:175px}.chat-inner{width:min(900px,100%)}
.welcome{padding-top:11vh}.welcome-logo{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}.quick{max-width:720px}.mode-line{display:flex;gap:7px;padding-bottom:7px}.mode{padding:7px 12px}.mode.active{background:#eff6ff;color:var(--blue);border-color:#bfdbfe}.input-box{min-height:60px;border-radius:18px;padding:7px 8px}.input-tool{width:42px;height:42px;flex:none;border:0;border-radius:12px;background:transparent;color:#4b5563;font-size:21px;display:grid;place-items:center}.input-tool:hover{background:#f3f4f6;color:var(--blue)}.send{order:5}.stop{order:5}.attachments{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.attachment{display:flex;align-items:center;gap:6px;background:#f3f6fa;border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:10px;color:#475569}.attachment button{border:0;background:transparent;color:#94a3b8;cursor:pointer}.panel{background:#fff;border-left:1px solid var(--line)}.panel-head{background:#fff}.panel-body{background:#fff}.overlay{background:rgba(15,23,42,.28);z-index:170}.card{background:#fff}.side-quota{background:#fafafa}.side-title{color:#64748b}.service.active{background:#eff6ff}.message .amon-bubble{background:#fff}.user-bubble{background:#eff6ff!important}.note{color:#7c8795}
@media(max-width:760px){.tools-menu span{display:none}.tools-menu{width:40px;height:38px;padding:0;display:grid;place-items:center}.welcome{padding-top:7vh}.sidebar{width:min(330px,92vw)}}
</style>

<script>
(() => {
  'use strict';
  const API = '';
  const state = { mode:'learn', responseStyle:localStorage.getItem('amon_response_style')||'auto', history:[], activeChatId:null, abort:null, busy:false };
  const $ = id => document.getElementById(id);
  const input = $('messageInput'), chat = $('chat'), chatInner = $('chatInner');

  function toast(text){ const el=$('toast'); el.textContent=text; el.classList.remove('hidden'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.add('hidden'),2600); }
  function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let followLatest=true;
  function updateFollowState(){
    const gap=chat.scrollHeight-chat.scrollTop-chat.clientHeight;
    followLatest=gap<90;
    $('jumpLatest')?.classList.toggle('hidden',followLatest);
  }
  function scrollBottom(force=false){
    if(!force&&!followLatest)return;
    requestAnimationFrame(()=>{ chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}); });
  }
  function uid(){return 'chat_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);}
  function normalizeHistory(list){
    if(!Array.isArray(list))return [];
    return list.map(x=>{
      if(x&&Array.isArray(x.messages)) return {id:x.id||uid(),title:x.title||'محادثة',messages:x.messages,time:Number(x.time)||Date.now(),updatedAt:Number(x.updatedAt||x.time)||Date.now(),pinned:!!x.pinned,archived:!!x.archived};
      return null;
    }).filter(Boolean);
  }
  function saveHistory(){try{localStorage.setItem('amon_history',JSON.stringify(state.history));}catch{}}
  function loadHistory(){try{state.history=normalizeHistory(JSON.parse(localStorage.getItem('amon_history')||'[]'));}catch{state.history=[]}renderHistory();}
  function renderHistory(){
    const box=$('history');
    const visible=state.history.filter(x=>!x.archived).sort((a,b)=>(b.pinned-a.pinned)||(b.updatedAt-a.updatedAt));
    if(!visible.length){box.innerHTML='<div class="history-empty">لا توجد محادثات محفوظة بعد.</div>';return;}
    box.innerHTML=visible.map(x=>`<div class="history-item${x.pinned?' pinned':''}" data-history="${x.id}"><button class="history-title" type="button" data-open-chat="${x.id}">${escapeHTML(x.title||'محادثة')}</button><div class="history-actions"><button class="history-action" type="button" title="${x.pinned?'إلغاء التثبيت':'تثبيت'}" data-pin-chat="${x.id}">📌</button><button class="history-action" type="button" title="أرشفة" data-archive-chat="${x.id}">▣</button><button class="history-action" type="button" title="حذف" data-delete-chat="${x.id}">🗑</button></div></div>`).join('');
  }
  function getActiveChat(){return state.history.find(x=>x.id===state.activeChatId)||null;}
  function ensureActiveChat(firstMessage){
    let chat=getActiveChat();
    if(!chat){
      chat={id:uid(),title:String(firstMessage||'محادثة جديدة').slice(0,60),messages:[],time:Date.now(),updatedAt:Date.now(),pinned:false,archived:false};
      state.history.push(chat);state.activeChatId=chat.id;
    }
    return chat;
  }
  function renderChat(chat){
    document.querySelectorAll('.message').forEach(x=>x.remove());
    const welcome=$('welcome');if(welcome)welcome.remove();
    if(!chat||!chat.messages?.length){newChat();return;}
    for(const m of chat.messages){if(m.role==='user')addUser(m.content);else addAmon(m.content,false,m.id);}
    scrollBottom();
  }
  function openChat(id){const chat=state.history.find(x=>x.id===id);if(!chat)return;state.activeChatId=id;renderChat(chat);$('sidebar').classList.remove('open');}
  window.AMONChat = {
    getHistory(){ return state.history; },
    openChat(id){ openChat(id); },
    async loadPersistedConversation(id, title, messages){
      if(!id) return;
      const localId = 'sb_'+id;
      let chat = state.history.find(x=>x.id===localId);
      if(!chat){
        chat={id:localId,title:title||'محادثة',messages:[],time:Date.now(),updatedAt:Date.now(),pinned:false,archived:false,persistedId:id};
        state.history.push(chat);
      }
      chat.title=title||chat.title;
      chat.messages=Array.isArray(messages)?messages.map(m=>({id:uid(),role:m.role==='assistant'?'assistant':'user',content:String(m.content||''),time:Date.now()})):[];
      chat.updatedAt=Date.now();
      state.activeChatId=localId;
      saveHistory(); renderHistory(); renderChat(chat);
      $('sidebar').classList.remove('open');
    }
  };
  function deleteChat(id){state.history=state.history.filter(x=>x.id!==id);if(state.activeChatId===id)state.activeChatId=null;saveHistory();renderHistory();if(!state.activeChatId)newChat();}
  function archiveChat(id){const chat=state.history.find(x=>x.id===id);if(!chat)return;chat.archived=true;chat.updatedAt=Date.now();if(state.activeChatId===id)state.activeChatId=null;saveHistory();renderHistory();newChat();toast('تمت أرشفة المحادثة');}
  function togglePin(id){const chat=state.history.find(x=>x.id===id);if(!chat)return;chat.pinned=!chat.pinned;saveHistory();renderHistory();}
  function addUser(text){ const el=document.createElement('div');el.className='message user';el.innerHTML=`<div class="user-bubble">${escapeHTML(text)}</div>`;chatInner.appendChild(el);scrollBottom(); }
  function fileIcon(format){return ({pdf:"PDF",docx:"W",xlsx:"X",pptx:"P",csv:"CSV",json:"{}",html:"</>",xml:"XML",md:"MD",txt:"TXT"})[String(format||"").toLowerCase()]||"FILE";}
  function base64ToBlob(base64,mime){const binary=atob(base64);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime||"application/octet-stream"});}
  function addFileCard(parent,file){
    if(!file||!file.base64)return;
    const blob=base64ToBlob(file.base64,file.mime),url=URL.createObjectURL(blob);
    const card=document.createElement("div");card.className="amon-file-card";
    const fmt=String(file.format||"file").toUpperCase(),size=file.size?Math.max(1,Math.round(file.size/1024))+" KB":"ملف جاهز";
    card.innerHTML='<div class="file-card-main"><div class="file-card-icon">'+fileIcon(file.format)+'</div><div class="file-card-info"><div class="file-card-name"></div><div class="file-card-meta">'+fmt+' • '+size+'</div></div></div><div class="file-card-menu"><button class="file-card-action" data-file-action="open">فتح</button><button class="file-card-action" data-file-action="share">مشاركة</button><button class="file-card-action" data-file-action="edit">تعديل</button><button class="file-card-action" data-file-action="save">حفظ</button></div>';
    card.querySelector(".file-card-name").textContent=file.fileName||"AMON File";
    card.querySelector(".file-card-main").addEventListener("click",()=>card.classList.toggle("open"));
    card.querySelector('[data-file-action="open"]').onclick=()=>window.open(url,"_blank","noopener");
    card.querySelector('[data-file-action="save"]').onclick=()=>{const a=document.createElement("a");a.href=url;a.download=file.fileName||"AMON_File";a.click();};
    card.querySelector('[data-file-action="share"]').onclick=async()=>{
      try{
        const shareFile=new File([blob],file.fileName||"AMON_File",{type:file.mime});
        if(navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]})){
          await navigator.share({files:[shareFile],title:file.fileName||"AMON File"});
        }else{
          await navigator.clipboard.writeText(url);
          toast("تم نسخ رابط الملف المؤقت");
        }
      }catch{}
    };
    card.querySelector('[data-file-action="edit"]').onclick=()=>{const text=prompt("اكتب التعديل المطلوب على الملف:");if(text){input.value="عدّل الملف التالي: "+(file.fileName||"AMON File")+"\n"+text;input.focus();}};
    parent.appendChild(card);
  }

  function escapeAndLinkify(text){
    let raw=String(text||"");
    const tokens=[];
    raw=raw.replace(/\[([^\]]{1,120})\]\((https?:\/\/[^\s)]+)\)/gi,(_,label,url)=>{

  function renderAmonTextAnimated(el,text){
    return new Promise(resolve=>{
      const full=String(text||'');
      const chunks=full.match(/\S+\s*|\n/g)||[];
      let i=0, rafScroll=0;
      el.classList.add('amon-live-writing');
      el.textContent='';
      const follow=()=>{
        cancelAnimationFrame(rafScroll);
        rafScroll=requestAnimationFrame(()=>{if(followLatest)chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});});
      };
      const write=()=>{
        // AMON's signature cadence: calm, readable, then slightly faster inside long paragraphs.
        const progress=chunks.length?i/chunks.length:1;
        const batch=progress<.12?1:(full.length>2400?2:1);
        let part='';
        for(let n=0;n<batch&&i<chunks.length;n++,i++) part+=chunks[i];
        el.textContent+=part;
        follow();
        if(i<chunks.length){
          const word=part.trim();
          let delay=52;
          if(/[.!?؟]\s*$/.test(part)) delay=260;

          if(full.length>2600) delay=Math.max(34,Math.round(delay*.82));
          setTimeout(write,delay);
        }else{
          el.classList.remove('amon-live-writing');
          renderAmonText(el,full);
          follow();
          resolve();
        }
      };
      write();
    });
  }

    if(amonQuota.messages>=AMON_QUOTA.messages)return false;
    amonQuota.messages+=1;
    try{localStorage.setItem('amonQuotaV4',JSON.stringify(amonQuota));}catch{}
    renderQuota();
    return true;
  }
  function remainingTime(){
    ensureQuota();
    const ms=Math.max(0,AMON_QUOTA.windowMs-(Date.now()-amonQuota.windowStartedAt));
    const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
    return h+' ساعة و '+m+' دقيقة';
  }
  function renderQuota(){
    ensureQuota();
    $('msgQuota').textContent=AMON_QUOTA.testMode?'اختبار بلا حد':amonQuota.messages+' / '+AMON_QUOTA.messages;
    $('imgQuota').textContent=amonQuota.images+' / '+AMON_QUOTA.images;
    $('msgBar').style.width=AMON_QUOTA.testMode?'0%':Math.min(100,amonQuota.messages/AMON_QUOTA.messages*100)+'%';
    $('imgBar').style.width=Math.min(100,amonQuota.images/AMON_QUOTA.images*100)+'%';
    const quotaNote=document.getElementById('quotaNote');
    if(quotaNote)quotaNote.textContent=AMON_QUOTA.testMode?'وضع الاختبار: حد الرسائل والمؤقت متوقفان مؤقتًا.':'التجديد الكامل بعد: '+remainingTime();
  }
  function saveQuota(){localStorage.setItem('amonQuotaV4',JSON.stringify(amonQuota));renderQuota();}
  const serviceNames={search:'بحث عميق',canvas:'Canvas',files:'الملفات',images:'الصور',explore:'استكشاف'};
  function openService(k){
    if(k==='search'){
      setResponseStyle('deep');setMode('research');
      openPanel('بحث عميق','<div class="card tool-workspace"><h3>⌕ بحث عميق</h3><p>اكتب موضوع البحث. سيستخدم AMON وضع التحليل والبحث المتاح داخل النظام.</p><textarea id="toolSearchText" placeholder="مثال: حلّل أحدث اتجاهات الذكاء الاصطناعي"></textarea><div class="tool-actions"><button class="primary" id="runToolSearch">ابدأ البحث</button></div></div>');
      setTimeout(()=>document.getElementById('runToolSearch')?.addEventListener('click',()=>{const v=document.getElementById('toolSearchText')?.value.trim();if(v){closePanel();input.value=v;resizeInput();send();}}),0);return;
    }
    if(k==='canvas'){
      openPanel('Canvas','<div class="card tool-workspace"><h3>▧ مساحة عمل AMON</h3><textarea id="amonCanvasText" placeholder="اكتب أفكارك أو مسودة العمل هنا..."></textarea><div class="tool-actions"><button class="primary" id="canvasUse">أرسل إلى AMON</button><button id="canvasCopy">نسخ</button><button id="canvasClear">مسح</button></div></div>');
      setTimeout(()=>{const t=document.getElementById('amonCanvasText');document.getElementById('canvasUse')?.addEventListener('click',()=>{if(t?.value.trim()){closePanel();input.value=t.value;resizeInput();keepComposerReady();}});document.getElementById('canvasCopy')?.addEventListener('click',()=>navigator.clipboard?.writeText(t?.value||'').then(()=>toast('تم النسخ')));document.getElementById('canvasClear')?.addEventListener('click',()=>{if(t)t.value='';});},0);return;
    }
    if(k==='files'){openPanel('الملفات','<div class="card tool-workspace"><h3>⌘ الملفات</h3><p>أرفق ملفًا ليقوم AMON بتحليله، أو اطلب إنشاء ملف بصيغة محددة.</p><div class="tool-actions"><button class="primary" id="amonFilesAction">اختيار ملف</button></div></div>');setTimeout(()=>document.getElementById("amonFilesAction")?.addEventListener('click',()=>document.getElementById("fileInput")?.click()),0);return;}
    if(k==='images'){
      openPanel('الصور','<div class="card tool-workspace"><h3>◉ الصور</h3><p>صف الصورة التي تريد إنشاءها أو تحليلها. سيُرسل الطلب إلى وضع الصور المتاح في AMON.</p><textarea id="toolImageText" placeholder="صف الصورة بالتفصيل..."></textarea><div class="tool-actions"><button class="primary" id="runToolImage">متابعة</button></div></div>');
      setTimeout(()=>document.getElementById('runToolImage')?.addEventListener('click',()=>{const v=document.getElementById('toolImageText')?.value.trim();if(v){closePanel();setMode('creative');input.value='أنشئ أو حلّل الصورة التالية: '+v;resizeInput();send();}}),0);return;
    }
    if(k==='explore'){
      openPanel('استكشاف','<div class="card"><h3>◇ استكشاف</h3><p>اختر نقطة بداية ثم سيجهز AMON مساحة المحادثة للمهمة.</p><div class="style-row"><button class="style-chip" data-explore="اقترح 10 أفكار جديدة ومفيدة">أفكار</button><button class="style-chip" data-explore="اشرح موضوعًا جديدًا بطريقة تعليمية">تعلّم</button><button class="style-chip" data-explore="ساعدني في ابتكار مشروع جديد">إبداع</button></div></div>');
      setTimeout(()=>document.querySelectorAll('[data-explore]').forEach(b=>b.addEventListener('click',()=>{closePanel();input.value=b.dataset.explore;resizeInput();keepComposerReady();})),0);return;
    }
  }
  document.addEventListener('click',e=>{
    const s=e.target.closest('[data-service]');
    if(s){
      document.querySelectorAll('.service').forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
      if(s.dataset.service==='chat'){newChat();keepComposerReady();}else openService(s.dataset.service); $('sidebar').classList.remove('open');
    }
    if(e.target.closest('#upgradeBtn')){
      openPanel('الاشتراك','<div class="card"><h3>👑 خطط AMON</h3><p><b>FREE</b> — محادثة وتوليد صور ضمن حصص مجانية.</p><p><b>PLUS / PRO</b> — حدود أعلى وأدوات ونماذج متقدمة حسب الخطة.</p><p>الأسعار ووسائل الدفع ستُربط لاحقًا بنظام الاشتراكات الحقيقي.</p></div>');
    }
  });

  renderQuota();
  setInterval(renderQuota,1000);
  window.addEventListener('storage',e=>{if(e.key==='amonQuotaV4')renderQuota();});

  window.addEventListener('load',()=>{applyTheme(localStorage.getItem('amon_theme')==='dark'?'dark':'light');loadHistory();resizeInput();health();input.focus();});
})();
</script>
<script>
window.AMONFileStudio={
  formats:["txt","md","html","json","csv","xml","pdf","docx","xlsx","pptx"],
  async generate({format="txt",title="AMON File",name="",content=""}={}){
    const res=await fetch("/api/files/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({format,title,name,content})});
    const data=await res.json();
    if(!data.success) throw new Error(data.message||"تعذر إنشاء الملف");
    const file=data.file;
    const binary=atob(file.base64); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:file.mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=file.fileName;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    return file;
  }
};
</script>
