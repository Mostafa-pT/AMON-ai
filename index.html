<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#080b10">
  <meta name="description"
        content="AMON AI - منصة تعليمية وذكاء اصطناعي">

  <title>AMON AI</title>

  <style>
    :root {
      --bg: #07090d;
      --panel: #0d1118;
      --panel-2: #121821;
      --panel-3: #171f2a;
      --border: #232d3a;
      --text: #f5f7fa;
      --muted: #8c98a8;
      --blue: #168cff;
      --green: #19d36b;
      --danger: #ff5b67;
      --shadow: 0 12px 40px rgba(0,0,0,.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        Arial,
        "Segoe UI",
        Tahoma,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ==========================================
       APP
    ========================================== */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }

    /* ==========================================
       SIDEBAR
    ========================================== */

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 30;
    }

    .sidebar-top {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--green)
        );
      color: #001;
      font-weight: 900;
      box-shadow:
        0 0 22px rgba(22,140,255,.18);
    }

    .brand-text strong {
      display: block;
      font-size: 17px;
    }

    .brand-text span {
      color: var(--muted);
      font-size: 11px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 13px;
      padding: 12px;
      transition: .2s;
    }

    .new-chat:hover {
      border-color: var(--blue);
      background: var(--panel-3);
    }

    .sidebar-title {
      color: var(--muted);
      font-size: 12px;
      padding: 16px 16px 8px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 10px;
    }

    .history-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: right;
      padding: 11px;
      border-radius: 11px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--panel-2);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding: 12px;
    }

    .sidebar-action {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: right;
      padding: 10px;
      border-radius: 10px;
    }

    .sidebar-action:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    /* ==========================================
       MAIN
    ========================================== */

    .main {
      min-width: 0;
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       HEADER
    ========================================== */

    .header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 16px;
      background: rgba(7,9,13,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      z-index: 20;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-menu {
      display: none;
    }

    .header-title {
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: 12px;
    }

    .connection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
    }

    .icon-btn:hover {
      background: var(--panel-2);
      color: var(--text);
      border-color: var(--border);
    }

    /* ==========================================
       CHAT
    ========================================== */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 16px 190px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      width: min(850px, 100%);
      margin: auto;
    }

    .welcome {
      text-align: center;
      padding: 9vh 12px 30px;
    }

    .welcome-logo {
      width: 70px;
      height: 70px;
      margin: auto auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--green)
        );
      color: #001;
      font-size: 30px;
      font-weight: 900;
      box-shadow:
        0 15px 50px rgba(22,140,255,.15);
    }

    .welcome h1 {
      font-size: clamp(29px, 5vw, 46px);
      margin-bottom: 12px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.9;
      max-width: 620px;
      margin: auto;
    }

    .quick-actions {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));
      gap: 10px;
      max-width: 650px;
      margin: 28px auto;
    }

    .quick-action {
      text-align: right;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 15px;
      padding: 14px;
      transition: .2s;
    }

    .quick-action:hover {
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    .quick-action small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
      font-size: 11px;
    }

    /* ==========================================
       MESSAGES
    ========================================== */

    .message {
      margin: 18px 0;
      animation: appear .2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-user {
      display: flex;
      justify-content: flex-start;
    }

    .message-user .bubble {
      max-width: 78%;
      background: #132238;
      border: 1px solid #1b3a5e;
      border-radius: 18px 18px 4px 18px;
      padding: 13px 15px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .message-amon {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
    }

    .amon-avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #001;
      font-weight: 900;
    }

    .message-amon-content {
      min-width: 0;
      flex: 1;
    }

    .message-amon .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      padding: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-meta {
      color: var(--muted);
      font-size: 10px;
      margin: 5px 8px;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .message-action {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      padding: 6px 9px;
      font-size: 11px;
    }

    .message-action:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    /* ==========================================
       TYPING
    ========================================== */

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 70%, 100% {
        opacity: .25;
      }

      35% {
        opacity: 1;
      }
    }

    /* ==========================================
       COMPOSER
    ========================================== */

    .composer {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 280px;
      padding:
        14px 16px
        calc(14px + env(safe-area-inset-bottom));
      background:
        linear-gradient(
          transparent,
          rgba(7,9,13,.96) 35%
        );
      z-index: 15;
    }

    .composer-inner {
      width: min(850px, 100%);
      margin: auto;
    }

    .mode-row {
      display: flex;
      gap: 7px;
      margin-bottom: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mode-row::-webkit-scrollbar {
      display: none;
    }

    .mode {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
    }

    .mode.active {
      color: var(--text);
      border-color: var(--blue);
      background: #10223a;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      box-shadow: var(--shadow);
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      max-height: 150px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 12px 9px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #697585;
    }

    .composer-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel-3);
      color: var(--muted);
    }

    .composer-btn:hover {
      color: var(--text);
    }

    .send {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
      font-size: 17px;
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .stop {
      background: #3a1820;
      border-color: #65303a;
      color: #ff8b94;
    }

    .composer-note {
      text-align: center;
      color: #657080;
      font-size: 9px;
      margin-top: 7px;
    }

    /* ==========================================
       PANELS
    ========================================== */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(4px);
      z-index: 50;
    }

    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      width: min(380px, 92vw);
      background: var(--panel);
      border-left: 1px solid var(--border);
      z-index: 60;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .panel-header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .panel-section {
      margin-bottom: 22px;
    }

    .panel-section h3 {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      margin-bottom: 8px;
      background: var(--panel-2);
    }

    .setting small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }

    .select,
    .text-input {
      border: 1px solid var(--border);
      background: var(--panel-3);
      color: var(--text);
      border-radius: 9px;
      padding: 8px;
      outline: none;
    }

    /* ==========================================
       TOAST
    ========================================== */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%);
      z-index: 100;
      background: var(--panel-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      box-shadow: var(--shadow);
    }

    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        transform: translateX(105%);
        transition: transform .25s ease;
        z-index: 70;
        box-shadow: var(--shadow);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .composer {
        left: 0;
      }

      .header {
        padding: 0 10px;
      }

      .header-title {
        font-size: 14px;
      }

      .message-user .bubble {
        max-width: 90%;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .welcome {
        padding-top: 7vh;
      }

      .chat {
        padding-bottom: 185px;
      }
    }

    @media (max-width: 430px) {

      .header {
        height: 58px;
      }

      .header-title {
        display: none;
      }

      .connection {
        font-size: 10px;
      }

      .welcome h1 {
        font-size: 29px;
      }

      .welcome p {
        font-size: 13px;
      }

      .composer {
        padding:
          8px
          8px
          calc(8px + env(safe-area-inset-bottom));
      }

      .input-box {
        border-radius: 17px;
      }

      textarea {
        font-size: 15px;
      }

      .composer-note {
        display: none;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- ========================================
       SIDEBAR
  ========================================= -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

      <div class="brand">

        <div class="brand-mark">
          A
        </div>

        <div class="brand-text">
          <strong>AMON AI</strong>
          <span>منصة الذكاء والتعلم</span>
        </div>

      </div>

      <button
        class="new-chat"
        id="newChat">
        ＋ محادثة جديدة
      </button>

    </div>

    <div class="sidebar-title">
      المحادثات
    </div>

    <div
      class="history"
      id="history">
    </div>

    <div class="sidebar-bottom">

      <button
        class="sidebar-action"
        id="openSettings">
        ⚙️ الإعدادات
      </button>

      <button
        class="sidebar-action"
        id="openInfo">
        ℹ️ عن AMON
      </button>

    </div>

  </aside>


  <!-- ========================================
       MAIN
  ========================================= -->

  <main class="main">

    <header class="header">

      <div class="header-left">

        <button
          class="icon-btn mobile-menu"
          id="menuButton">
          ☰
        </button>

        <div class="header-title">
          AMON
        </div>

        <div class="connection">

          <span class="connection-dot"></span>

          <span id="status">
            النظام جاهز
          </span>

        </div>

      </div>


      <div class="header-right">

        <button
          class="icon-btn"
          id="searchButton"
          title="بحث">
          🔎
        </button>

        <button
          class="icon-btn"
          id="themeButton"
          title="الوضع الليلي">
          ◐
        </button>

        <button
          class="icon-btn"
          id="settingsButton"
          title="الإعدادات">
          ⚙
        </button>

      </div>

    </header>


    <!-- ======================================
         CHAT
    ======================================= -->

    <section
      class="chat"
      id="chat">

      <div
        class="chat-inner"
        id="chatInner">

        <div
          class="welcome"
          id="welcome">

          <div class="welcome-logo">
            A
          </div>

          <h1>
            مرحبًا بك في AMON
          </h1>

          <p>
            مساعدك الذكي للتعلم والبحث والفهم.
            اطرح سؤالًا، اطلب شرحًا، أو ابدأ موضوعًا جديدًا.
          </p>


          <div class="quick-actions">

            <button
              class="quick-action"
              data-prompt="اشرح لي هذا الموضوع بطريقة بسيطة خطوة بخطوة">
              🎓 شرح موضوع
              <small>
                تعلم بطريقة مبسطة
              </small>
            </button>

            <button
              class="quick-action"
              data-prompt="ساعدني على فهم هذا الموضوع مع أمثلة">
              💡 فهم وأمثلة
              <small>
                أمثلة وتطبيقات
              </small>
            </button>

            <button
              class="quick-action"
              data-prompt="قارن بين المعلومات المختلفة واذكر نقاط الاتفاق والاختلاف">
              ⚖️ مقارنة
              <small>
                مقارنة المعلومات مستقبلًا
              </small>
            </button>

            <button
              class="quick-action"
              data-prompt="ساعدني في إنشاء خطة لتعلم هذا الموضوع">
              🧭 خطة تعلم
              <small>
                بناء مسار تعليمي
              </small>
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- ======================================
         COMPOSER
    ======================================= -->

    <div class="composer">

      <div class="composer-inner">

        <div class="mode-row">

          <button
            class="mode active"
            data-mode="learn">
            🎓 تعلم
          </button>

          <button
            class="mode"
            data-mode="explain">
            💡 شرح
          </button>

          <button
            class="mode"
            data-mode="research">
            🔎 بحث
          </button>

          <button
            class="mode"
            data-mode="compare">
            ⚖️ مقارنة
          </button>

        </div>


        <div class="input-box">

          <button
            class="composer-btn"
            id="attachButton"
            title="إرفاق ملف">
            ＋
          </button>

          <textarea
            id="input"
            rows="1"
            plac
