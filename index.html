<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07090d">

  <meta
    name="description"
    content="AMON AI - منصة الذكاء والتعلم والبحث"
  >

  <title>AMON AI</title>

  <style>
    :root {
      --bg: #07090d;
      --panel: #0d1118;
      --panel2: #121821;
      --panel3: #171f2a;
      --border: #26303d;

      --text: #f5f7fa;
      --muted: #8995a5;

      --blue: #168cff;
      --green: #19d36b;
      --red: #ff5967;
      --yellow: #f5c451;

      --radius: 18px;
      --shadow: 0 15px 50px rgba(0,0,0,.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family:
        Arial,
        "Segoe UI",
        Tahoma,
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================
       APP
    ========================================= */

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;

      display: flex;

      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(22,140,255,.08),
          transparent 40%
        ),
        var(--bg);
    }

    /* =========================================
       SIDEBAR
    ========================================= */

    .sidebar {
      width: 280px;
      height: 100%;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: rgba(13,17,24,.98);

      border-left: 1px solid var(--border);

      z-index: 80;

      transition: transform .25s ease;
    }

    .sidebar-top {
      padding: 16px;

      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 16px;
    }

    .brand-mark,
    .welcome-logo,
    .amon-avatar {
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--green)
        );

      color: #00120a;

      font-weight: 900;
    }

    .brand-mark {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;

      box-shadow:
        0 0 30px rgba(22,140,255,.15);
    }

    .brand-text strong {
      display: block;
      font-size: 17px;
    }

    .brand-text span {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;
    }

    .new-chat {
      width: 100%;

      padding: 12px;

      border: 1px solid var(--border);

      border-radius: 13px;

      background: var(--panel2);

      color: var(--text);

      transition: .2s;
    }

    .new-chat:hover {
      border-color: var(--blue);
      background: var(--panel3);
    }

    .sidebar-title {
      padding: 16px 16px 8px;

      color: var(--muted);

      font-size: 12px;
    }

    .history {
      flex: 1;

      overflow-y: auto;

      padding: 0 10px 10px;
    }

    .history-item {
      width: 100%;

      display: block;

      margin-bottom: 4px;

      padding: 11px;

      border-radius: 11px;

      background: transparent;

      color: var(--text);

      text-align: right;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--panel2);
    }

    .sidebar-bottom {
      padding: 12px;

      border-top: 1px solid var(--border);
    }

    .sidebar-action {
      width: 100%;

      display: block;

      padding: 11px;

      margin-bottom: 4px;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      text-align: right;
    }

    .sidebar-action:hover {
      background: var(--panel2);
      color: var(--text);
    }

    /* =========================================
       MAIN
    ========================================= */

    .main {
      min-width: 0;

      flex: 1;

      height: 100%;

      display: flex;
      flex-direction: column;

      position: relative;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      height: 62px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;

      background: rgba(7,9,13,.92);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(16px);

      z-index: 30;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;

      gap: 7px;
    }

    .header-title {
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;

      gap: 6px;

      color: var(--green);

      font-size: 11px;
    }

    .connection-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 10px var(--green);
    }

    .connection.offline {
      color: var(--red);
    }

    .connection.offline .connection-dot {
      background: var(--red);

      box-shadow:
        0 0 10px var(--red);
    }

    .icon-btn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid transparent;

      border-radius: 11px;

      background: transparent;

      color: var(--muted);

      font-size: 17px;
    }

    .icon-btn:hover {
      background: var(--panel2);

      color: var(--text);

      border-color: var(--border);
    }

    .mobile-menu {
      display: none;
    }

    /* =========================================
       CHAT
    ========================================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding:
        25px 15px
        190px;

      scroll-behavior: smooth;

      overscroll-behavior: contain;
    }

    .chat-inner {
      width: min(850px, 100%);

      margin: auto;
    }

    .welcome {
      text-align: center;

      padding:
        8vh 10px
        30px;
    }

    .welcome-logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      font-size: 30px;

      box-shadow:
        0 20px 60px rgba(22,140,255,.12);
    }

    .welcome h1 {
      margin-bottom: 12px;

      font-size:
        clamp(29px, 5vw, 45px);
    }

    .welcome p {
      max-width: 620px;

      margin: auto;

      color: var(--muted);

      line-height: 1.9;

      font-size: 14px;
    }

    /* =========================================
       QUICK ACTIONS
    ========================================= */

    .quick-actions {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 10px;

      max-width: 650px;

      margin: 28px auto;
    }

    .quick-action {
      padding: 14px;

      border: 1px solid var(--border);

      border-radius: 15px;

      background: var(--panel);

      color: var(--text);

      text-align: right;

      transition: .2s;
    }

    .quick-action:hover {
      border-color: var(--blue);

      background: var(--panel2);

      transform: translateY(-1px);
    }

    .quick-action small {
      display: block;

      margin-top: 5px;

      color: var(--muted);

      font-size: 11px;
    }

    /* =========================================
       MESSAGES
    ========================================= */

    .message {
      margin: 18px 0;

      animation:
        messageAppear .2s ease;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;

        transform:
          translateY(6px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    .message-user {
      display: flex;

      justify-content: flex-start;
    }

    .message-user .bubble {
      max-width: 80%;

      padding: 13px 15px;

      border:
        1px solid #1b3a5e;

      border-radius:
        18px
        18px
        4px
        18px;

      background: #132238;

      line-height: 1.8;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .message-amon {
      display: flex;

      align-items: flex-start;

      gap: 9px;
    }

    .amon-avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      font-size: 14px;
    }

    .message-amon-content {
      min-width: 0;

      flex: 1;
    }

    .message-amon .bubble {
      padding: 15px;

      border:
        1px solid var(--border);

      border-radius:
        18px
        18px
        18px
        4px;

      background: var(--panel);

      line-height: 1.9;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .message-meta {
      margin: 5px 8px;

      color: var(--muted);

      font-size: 10px;
    }

    .message-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      margin-top: 7px;
    }

    .message-action {
      padding: 6px 9px;

      border:
        1px solid var(--border);

      border-radius: 9px;

      background: transparent;

      color: var(--muted);

      font-size: 11px;
    }

    .message-action:hover {
      background: var(--panel2);

      color: var(--text);
    }

    /* =========================================
       TYPING
    ========================================= */

    .typing {
      height: 22px;

      display: flex;

      align-items: center;

      gap: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--muted);

      animation:
        typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%,
      70%,
      100% {
        opacity: .25;
      }

      35% {
        opacity: 1;
      }
    }

    /* =========================================
       COMPOSER
    ========================================= */

    .composer {
      position: fixed;

      right: 0;
      bottom: 0;
      left: 280px;

      padding:
        12px 15px
        calc(
          10px +
          env(safe-area-inset-bottom)
        );

      background:
        linear-gradient(
          transparent,
          rgba(7,9,13,.98) 34%
        );

      z-index: 40;
    }

    .composer-inner {
      width: min(850px, 100%);

      margin: auto;
    }

    .mode-row {
      display: flex;

      gap: 7px;

      margin-bottom: 8px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .mode-row::-webkit-scrollbar {
      display: none;
    }

    .mode {
      flex-shrink: 0;

      padding: 7px 10px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background: var(--panel);

      color: var(--muted);

      font-size: 11px;
    }

    .mode.active {
      background: #10223a;

      border-color: var(--blue);

      color: var(--text);
    }

    .input-box {
      width: 100%;

      min-height: 60px;

      display: flex;

      align-items: flex-end;

      gap: 7px;

      padding: 8px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background: var(--panel2);

      box-shadow: var(--shadow);

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .input-box:focus-within {
      border-color:
        rgba(22,140,255,.7);

      box-shadow:
        0 0 0 3px
        rgba(22,140,255,.08),
        var(--shadow);
    }

    textarea {
      flex: 1;

      width: 100%;

      min-width: 0;

      min-height: 44px;

      max-height: 150px;

      resize: none;

      overflow-y: auto;

      outline: none;

      border: 0;

      background: transparent;

      color: var(--text);

      padding: 11px 9px;

      line-height: 1.5;

      font-size: 16px;

      appearance: none;

      -webkit-appearance: none;
    }

    textarea::placeholder {
      color: #697585;
    }

    .composer-btn {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid var(--border);

      border-radius: 13px;

      background: var(--panel3);

      color: var(--muted);

      font-size: 18px;
    }

    .composer-btn:hover {
      color: var(--text);

      border-color: var(--blue);
    }

    .send {
      background: var(--blue);

      border-color: var(--blue);

      color: white;

      font-size: 18px;
    }

    .send:disabled {
      opacity: .45;
    }

    .stop {
      background: #351820;

      border-color: #63303a;

      color: #ff8b94;
    }

    .composer-note {
      margin-top: 6px;

      color: #657080;

      text-align: center;

      font-size: 9px;
    }

    /* =========================================
       PANELS
    ========================================= */

    .overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.6);

      backdrop-filter:
        blur(5px);

      z-index: 90;
    }

    .side-panel {
      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;

      width:
        min(390px, 94vw);

      display: flex;

      flex-direction: column;

      background: var(--panel);

      border-left:
        1px solid var(--border);

      box-shadow: var(--shadow);

      z-index: 100;
    }

    .panel-header {
      height: 62px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 15px;

      border-bottom:
        1px solid var(--border);
    }

    .panel-body {
      flex: 1;

      overflow-y: auto;

      padding: 16px;
    }

    .panel-section {
      margin-bottom: 22px;
    }

    .panel-section h3 {
      margin-bottom: 10px;

      font-size: 13px;
    }

    .setting {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 12px;

      margin-bottom: 8px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      background: var(--panel2);
    }

    .setting-text {
      min-width: 0;
    }

    .setting-text strong {
      display: block;

      font-size: 12px;
    }

    .setting-text small {
      display: block;

      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.5;
    }

    .select {
      min-width: 110px;

      padding: 8px;

      border:
        1px solid var(--border);

      border-radius: 9px;

      outline: none;

      background: var(--panel3);

      color: var(--text);
    }

    .panel-button {
      width: 100%;

      padding: 11px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background: var(--panel2);

      color: var(--text);

      margin-top: 7px;
    }

    .panel-button:hover {
      border-color: var(--blue);
    }

    /* =========================================
       TOAST
    ========================================= */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 105px;

      transform:
        translateX(-50%);

      max-width: 90vw;

      padding: 10px 14px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background: var(--panel3);

      color: var(--text);

      box-shadow: var(--shadow);

      z-index: 200;

      font-size: 12px;

      text-align: center;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;

        transform:
          translateX(105%);

        box-shadow: var(--shadow);
      }

      .sidebar.open {
        transform:
          translateX(0);
      }

      .mobile-menu {
        display: flex;
      }

      .composer {
        left: 0;
      }

      .header {
        height: 58px;

        padding: 0 9px;
      }

      .message-user .bubble {
        max-width: 90%;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .welcome {
        padding-top: 6vh;
      }

      .chat {
        padding-bottom: 185px;
      }
    }

    @media (max-width: 430px) {

      .header-title {
        display: none;
      }

      .connection {
        font-size: 10px;
      }

      .welcome h1 {
        font-size: 29px;
      }

      .welcome p {
        font-size: 13px;
      }

      .welcome-logo {
        width: 62px;
        height: 62px;
        border-radius: 19px;
      }

      .composer {
        padding:
          7px 7px
          calc(
            7px +
            env(safe-area-inset-bottom)
          );
      }

      .input-box {
        min-height: 57px;

        border-radius: 17px;
      }

      textarea {
        font-size: 16px;

        min-height: 41px;
      }

      .composer-note {
        display: none;
      }

      .composer-btn {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-mark">
            A
          </div>

          <div class="brand-text">

            <strong>
              AMON AI
            </strong>

            <span>
              منصة الذكاء والتعلم
            </span>

          </div>

        </div>

        <button
          class="new-chat"
          id="newChat"
          type="button"
        >
          ＋ محادثة جديدة
        </button>

      </div>

      <div class="sidebar-title">
        المحادثات
      </div>

      <div
        class="history"
        id="history"
      ></div>

      <div class="sidebar-bottom">

        <button
          class="sidebar-action"
          id="openSettings"
          type="button"
        >
          ⚙️ الإعدادات
        </button>

        <button
          class="sidebar-action"
          id="openInfo"
          type="button"
        >
          ℹ️ عن AMON
        </button>

      </div>

    </aside>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="main">

      <header class="header">

        <div class="header-left">

          <button
            class="icon-btn mobile-menu"
            id="menuButton"
            type="button"
            aria-label="القائمة"
          >
            ☰
          </button>

          <div class="header-title">
            AMON
          </div>

          <div
            class="connection"
            id="connection"
          >

            <span class="connection-dot"></span>

            <span id="status">
              النظام جاهز
            </span>

          </div>

        </div>

        <div class="header-right">

          <button
            class="icon-btn"
