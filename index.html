
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#07090d">

  <title>AMON AI</title>

  <style>

    /* =========================================================
       AMON AI
       MOBILE FIRST UI
       ========================================================= */

    :root {
      --bg: #07090d;
      --panel: #0d1118;
      --panel-2: #121821;
      --border: #27313d;

      --text: #f5f7fa;
      --muted: #8d99a8;

      --blue: #168cff;
      --green: #19d36b;
      --red: #ff5967;

      --header-height: 60px;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Arial,
        "Segoe UI",
        Tahoma,
        sans-serif;
    }


    body {
      min-height: 100dvh;
    }


    button,
    textarea {
      font: inherit;
    }


    button {
      border: 0;
      outline: none;
      cursor: pointer;
    }


    .hidden {
      display: none !important;
    }


    /* =========================================================
       MAIN APP
       ========================================================= */

    .app {
      width: 100%;
      height: 100dvh;

      display: flex;

      overflow: hidden;
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar {
      width: 280px;
      height: 100%;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: var(--panel);

      border-left: 1px solid var(--border);

      z-index: 100;
    }


    .sidebar-top {
      padding: 15px;

      border-bottom:
        1px solid var(--border);
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 15px;
    }


    .brand-logo {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--green)
        );

      color: #00150b;

      font-size: 22px;
      font-weight: 900;
    }


    .brand-title {
      font-weight: 900;
      font-size: 15px;
    }


    .brand-subtitle {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
    }


    .new-chat {
      width: 100%;

      padding: 12px;

      border-radius: 12px;

      background: var(--panel-2);

      border:
        1px solid var(--border);

      color: var(--text);
    }


    .new-chat:active {
      transform: scale(.98);
    }


    .sidebar-title {
      padding:
        14px 14px 7px;

      color: var(--muted);

      font-size: 12px;
    }


    .history {
      flex: 1;

      overflow-y: auto;

      padding: 8px;
    }


    .history-empty {
      padding: 12px;

      color: var(--muted);

      font-size: 11px;
    }


    .history-item {
      width: 100%;

      padding: 11px;

      margin-bottom: 4px;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      text-align: right;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    .history-item:hover,
    .history-item:active {
      background: var(--panel-2);

      color: var(--text);
    }


    .sidebar-bottom {
      padding: 10px;

      border-top:
        1px solid var(--border);
    }


    .sidebar-button {
      width: 100%;

      padding: 11px;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      text-align: right;
    }


    .sidebar-button:active {
      background: var(--panel-2);

      color: var(--text);
    }


    /* =========================================================
       MAIN
       ========================================================= */

    .main {
      position: relative;

      min-width: 0;

      flex: 1;

      height: 100%;

      display: flex;
      flex-direction: column;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      height: var(--header-height);

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 12px;

      background:
        rgba(7, 9, 13, .97);

      border-bottom:
        1px solid var(--border);

      z-index: 40;
    }


    .header-left,
    .header-right {
      display: flex;
      align-items: center;

      gap: 8px;
    }


    .header-title {
      font-size: 16px;
    }


    .icon-button {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 17px;
    }


    .icon-button:hover,
    .icon-button:active {
      background: var(--panel-2);

      color: var(--text);
    }


    .mobile-menu {
      display: none;
    }


    /* =========================================================
       CONNECTION STATUS
       ========================================================= */

    .connection {
      display: flex;
      align-items: center;

      gap: 6px;

      color: var(--green);

      font-size: 10px;
    }


    .connection-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 8px var(--green);
    }


    .connection.offline {
      color: var(--red);
    }


    .connection.offline
    .connection-dot {
      background: var(--red);

      box-shadow:
        0 0 8px var(--red);
    }


    /* =========================================================
       CHAT AREA
       ========================================================= */

    .chat {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      padding:
        25px 14px 180px;
    }


    .chat-inner {
      width: min(850px, 100%);

      margin: auto;
    }


    /* =========================================================
       WELCOME
       ========================================================= */

    .welcome {
      text-align: center;

      padding:
        6vh 8px 25px;
    }


    .welcome-logo {
      width: 70px;
      height: 70px;

      margin:
        0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--green)
        );

      color: #00150b;

      font-size: 32px;
      font-weight: 900;
    }


    .welcome h1 {
      margin:
        0 0 10px;

      font-size:
        clamp(28px, 6vw, 44px);
    }


    .welcome p {
      max-width: 620px;

      margin: auto;

      color: var(--muted);

      line-height: 1.9;

      font-size: 14px;
    }


    /* =========================================================
       QUICK ACTIONS
       ========================================================= */

    .quick-actions {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      max-width: 650px;

      margin:
        25px auto;
    }


    .quick-button {
      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: var(--panel);

      color: var(--text);

      text-align: right;
    }


    .quick-button:hover,
    .quick-button:active {
      border-color: var(--blue);

      background: #101b28;
    }


    .quick-button small {
      display: block;

      margin-top: 6px;

      color: var(--muted);

      font-size: 10px;
    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    .message {
      margin:
        18px 0;
    }


    .user-message {
      display: flex;

      justify-content: flex-start;
    }


    .user-bubble {
      max-width: 90%;

      padding:
        13px 15px;

      border:
        1px solid #1d4269;

      border-radius:
        18px 18px 4px 18px;

      background:
        #132238;

      line-height: 1.8;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }


    .amon-message {
      display: flex;

      align-items: flex-start;

      gap: 9px;
    }


    .amon-avatar {
      width: 35px;
      height: 35px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--green)
        );

      color: #00150b;

      font-weight: 900;
    }


    .amon-content {
      min-width: 0;

      flex: 1;
    }


    .amon-bubble {
      padding:
        15px;

      border:
        1px solid var(--border);

      border-radius:
        18px 18px 18px 4px;

      background:
        var(--panel);

      line-height: 1.9;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }


    .message-meta {
      margin:
        5px 8px;

      color: var(--muted);

      font-size: 9px;
    }


    .copy-button {
      padding:
        6px 9px;

      border:
        1px solid var(--border);

      border-radius: 9px;

      background: transparent;

      color: var(--muted);

      font-size: 10px;
    }


    .copy-button:active {
      background: var(--panel-2);

      color: var(--text);
    }


    /* =========================================================
       TYPING
       ========================================================= */

    .typing {
      display: flex;

      gap: 4px;
    }


    .typing span {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--muted);

      animation:
        typing 1s infinite;
    }


    .typing span:nth-child(2) {
      animation-delay: .15s;
    }


    .typing span:nth-child(3) {
      animation-delay: .30s;
    }


    @keyframes typing {

      0%,
      70%,
      100% {
        opacity: .2;
      }

      35% {
        opacity: 1;
      }
    }


    /* =========================================================
       COMPOSER
       ========================================================= */

    .composer {
      position: absolute;

      right: 0;
      bottom: 0;
      left: 0;

      padding:
        8px 14px
        calc(8px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          transparent,
          rgba(7,9,13,.99) 30%
        );

      z-index: 60;

      pointer-events: none;
    }


    .composer-inner {
      width: min(850px, 100%);

      margin: auto;

      pointer-events: auto;
    }


    /* =========================================================
       MODES
       ========================================================= */

    .mode-row {
      display: flex;

      gap: 7px;

      margin-bottom: 7px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .mode-row::-webkit-scrollbar {
      display: none;
    }


    .mode-button {
      flex-shrink: 0;

      padding:
        7px 11px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background:
        var(--panel);

      color: var(--muted);

      font-size: 11px;
    }


    .mode-button.active {
      border-color:
        var(--blue);

      background:
        #10223a;

      color:
        var(--text);
    }


    /* =========================================================
       INPUT
       ========================================================= */

    .input-container {
      display: flex;

      align-items: flex-end;

      gap: 7px;

      width: 100%;

      min-height: 59px;

      padding: 7px;

      border:
        1px solid var(--border);

      border-radius: 18px;

      background:
        var(--panel-2);

      box-shadow:
        0 10px 35px rgba(0,0,0,.35);
    }


    .input-container:focus-within {
      border-color:
        var(--blue);
    }


    #messageInput {
      flex: 1;

      min-width: 0;

      height: 44px;

      max-height: 140px;

      resize: none;

      outline: none;

      border: 0;

      background: transparent;

      color: var(--text);

      padding:
        10px 8px;

      line-height: 1.5;

      font-size: 16px;
    }


    #messageInput::placeholder {
      color: #697585;
    }


    .send-button,
    .stop-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;
    }


    .send-button {
      background:
        var(--blue);

      color: white;
    }


    .send-button:active {
      transform:
        scale(.95);
    }


    .stop-button {
      background:
        #351820;

      color:
        #ff8b94;
    }


    .composer-note {
      text-align: center;

      margin-top: 5px;

      color: #657080;

      font-size: 9px;
    }


    /* =========================================================
       PANELS
       ========================================================= */

    .overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.62);

      z-index: 150;
    }


    .panel {
      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;

      width:
        min(390px, 94vw);

      background:
        var(--panel);

      border-left:
        1px solid var(--border);

      z-index: 200;
    }


    .panel-header {
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 14px;

      border-bottom:
        1px solid var(--border);
    }


    .panel-body {
      height:
        calc(100% - 60px);

      overflow-y: auto;

      padding: 16px;
    }


    .panel-button {
      width: 100%;

      padding: 12px;

      margin-bottom: 8px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background:
        var(--panel-2);

      color: var(--text);
    }


    .system-card {
      padding: 13px;

      margin-bottom: 10px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background:
        var(--panel-2);
    }


    .system-card small {
      color: var(--muted);

      line-height: 1.8;
    }


    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 110px;

      transform:
        translateX(-50%);

      padding:
        10px 14px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background:
        #18212c;

      color:
        var(--text);

      z-index: 300;

      font-size: 12px;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;

        transform:
          translateX(105%);

        transition:
          transform .2s ease;
      }


      .sidebar.open {
        transform:
          translateX(0);
      }


      .mobile-menu {
        display: flex;
      }


      .chat {
        padding:
          20px 9px 175px;
      }


      .composer {
        padding-left: 7px;
        padding-right: 7px;
      }


      .quick-actions {
        grid-template-columns:
          1fr;
      }


      .user-bubble {
        max-width: 94%;
      }

    }


    @media (max-width: 430px) {

      .header-title {
        display: none;
      }


      .welcome {
        padding-top:
          5vh;
      }


      .welcome-logo {
        width: 62px;
        height: 62px;

        font-size: 28px;
      }


      .welcome p {
        font-size: 13px;
      }


      .composer-note {
        display: none;
      }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

    }

  </style>
</head>


<body>

  <div class="app">


    <!-- =======================================================
         SIDEBAR
         ======================================================= -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-logo">
            A
          </div>

          <div>

            <div class="brand-title">
              AMON AI
            </div>

            <div class="brand-subtitle">
              العقل المركزي
            </div>

          </div>

        </div>


        <button
          class="new-chat"
          id="newChat"
          type="button"
        >
          ＋ محادثة جديدة
        </button>

      </div>


      <div class="sidebar-title">
        المحادثات
      </div>


      <div
        class="history"
        id="history"
      ></div>


      <div class="sidebar-bottom">

        <button
          class="sidebar-button"
          id="openSettings"
          type="button"
        >
          ⚙️ الإعدادات
        </button>


        <button
          class="sidebar-button"
          id="openInfo"
          type="button"
        >
          ℹ️ عن AMON
        </button>

      </div>

    </aside>


    <!-- =======================================================
         MAIN
         ======================================================= -->

    <main class="main">


      <!-- HEADER -->

      <header class="header">

        <div class="header-left">

          <button
            class="icon-button mobile-menu"
            id="menuButton"
            type="button"
            aria-label="القائمة"
          >
            ☰
          </button>


          <strong class="header-title">
            AMON
          </strong>


          <div
            class="connection"
            id="connection"
          >

            <span
              class="connection-dot"
            ></span>

            <span id="status">
              جارٍ الفحص...
            </span>

          </div>

        </div>


        <div class="header-right">

          <button
            class="icon-button"
            id="healthButton"
            type="button"
            aria-label="فحص الاتصال"
          >
            ◉
          </button>

        </div>

      </header>


      <!-- CHAT -->

      <section
        class="chat"
        id="chat"
      >

        <div class="chat-inner">


          <!-- WELCOME -->

          <div
            class="welcome"
            id="welcome"
          >

            <div class="welcome-logo">
              A
            </div>


            <h1>
              مرحبًا بك في AMON
            </h1>


            <p>
              العقل المركزي لمنصة AMON AI.
              اكتب سؤالك وسأحاول مساعدتك بالمحرك المتص
